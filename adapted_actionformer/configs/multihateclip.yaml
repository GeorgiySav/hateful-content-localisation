# ─────────────────────────────────────────────────────────────────────────────
# Configuration for MultiHateClip Temporal Hateful Content Localization
#
# Key differences from default.yaml (HateMM):
#   - max_seq_len=64: all MultiHateClip videos are ≤60s; 64 is the smallest
#     multiple of 16 (= window_size-1) that covers every video without cropping.
#   - regression_ranges tuned to MultiHateClip segment distribution:
#       segments: min=1s, p25=9s, median=18s, p90=55s, max=60s
#       D/2 p25=4.5, p50=9.0, p75=19.5, p90=27.5
#   - Heavier regularization (dropout, droppath, weight_decay, label_smoothing)
#     because only 82 Hateful (339 with Offensive) training videos are available.
#   - More epochs to compensate for the smaller training set.
#   - focal_alpha=0.45: positive anchor rate is ~4% (slightly higher than HateMM
#     because hateful segments are proportionally longer relative to video length).
#   - max_detections=100: shorter videos mean fewer expected proposals.
# ─────────────────────────────────────────────────────────────────────────────

# Dataset
dataset:
  name: "multihateclip"
  # Paths to per-modality feature directories (one .pt file per video each)
  video_feat_dir: "../../data/multihateclip/video_features/"
  audio_feat_dir: "../../data/multihateclip/audio_features/"
  text_feat_dir:  "../../data/multihateclip/text_features/"
  annotation_file: "../../data/multihateclip/dataset/annotations.json"
  num_classes: 1                        # 1 = binary hate/no-hate
  feature_fps: 1.0                      # features per second (from extraction)
  max_seq_len: 64                       # all videos ≤60s; 64 divisible by 16 (window_size-1=16)
  # Input feature dimensions (must match extraction script output)
  input_dims:
    text: 768                           # HateBERT CLS
    audio: 1024                         # Wav2Vec2 Large
    video: 768                          # CLIP ViT-L/14

# Cross-modal fusion
fusion:
  d_cma: 128                            # CMA internal / output dimension (= backbone input)
  num_heads: 2                          # attention heads in CMA
  dropout: 0.1
  query_modality: "text"
  key_modalities: ["audio", "video"]
  zero_out_missing_query: true

# ActionFormer backbone
backbone:
  d_model: 128
  n_proj_layers: 1
  n_layers: 3                           # strides: [1, 2, 4]  →  T: [64, 32, 16]
  n_heads: 2
  window_size: 17                       # window_size-1=16 divides 64, 32, 16 cleanly
  downsample_start: 1
  downsample_ratio: 2

# Decoder heads
heads:
  n_layers: 1
  kernel_size: 3
  use_layer_norm: false

# Regression ranges per pyramid level (seconds at 1 FPS)
# Tuned to MultiHateClip segment D/2 distribution:
#   Level 0 (stride 1): D/2 in [0,  8)  → D <  16s  covers ~35% of segments
#   Level 1 (stride 2): D/2 in [8, 24)  → D 16–48s  covers ~45% of segments
#   Level 2 (stride 4): D/2 in [24, ∞)  → D ≥  48s  covers ~20% of segments
regression_ranges:
  - [0,    8]
  - [8,   24]
  - [24,  100000]

# Loss
loss:
  focal_alpha: 0.45          # ~4% positive anchor rate (HateMM-Hateful only: ~2.9%)
  focal_gamma: 3.0
  lambda_reg: 1.0
  center_sampling: true
  center_sampling_radius: 2.0

# Training
training:
  batch_size: 8

  epochs: 60                 # more epochs for smaller dataset (~80 Hateful videos)
  learning_rate: 1.0e-4
  weight_decay: 1.0e-3       # stronger than HateMM (5e-4) — small dataset
  warmup_epochs: 5
  lr_scheduler: "cosine"
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 1.0
  cls_prior_prob: 0.01
  dropout: 0.5
  droppath: 0.4              # slightly higher than HateMM (0.3) — small dataset
  label_smoothing: 0.15      # slightly higher than HateMM (0.1) — small dataset

# Temporal augmentation (training only)
augmentation:
  enabled: true
  feature_noise_std: 0.02        # slightly higher than HateMM (0.01) — more regularization
  temporal_mask_prob: 0.5
  temporal_mask_num: 2
  temporal_mask_max_len: 2       # reduced from 3: p10 segment is 4s, avoid masking too much
  segment_jitter_sec: 0.5        # ±0.5s — ~5% of median segment (18s), safe for short segs (min=1s)

# Inference
inference:
  score_threshold: 0.001
  nms_method: "soft_nms"
  nms_sigma: 0.4
  nms_threshold: 0.1
  max_detections: 100            # shorter videos → fewer expected proposals than HateMM
