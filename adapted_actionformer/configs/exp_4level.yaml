# ─────────────────────────────────────────────────────────────────────────────
# Experiment: 4-level pyramid
#
# Changes vs temporalmaxer.yaml baseline:
#   backbone.n_layers:   3 -> 4  (n_branch = 4-1 = 3, n_levels = 4)
#   regression_ranges:   4 entries to match n_levels=4
#
# Rationale: With 3 levels the finest stride is 4, covering segments
# up to ~128s before relying on the coarsest level's regression range.
# A 4th MaxPool block doubles that: finest stride 8, with regression
# ranges extended to [128, ∞) for very long segments.
# MaxPool blocks are parameter-free so this adds essentially zero params
# (only one more Scale module in RegHead, ~1 param).
#
# FPN strides: [1, 2, 4, 8]
# Regression ranges: [0,16], [16,64], [64,128], [128,∞)
# ─────────────────────────────────────────────────────────────────────────────

dataset:
  name: "hatemm"
  video_feat_dir: "../../data/hatemm/video_features"
  audio_feat_dir: "../../data/hatemm/audio_features"
  text_feat_dir:  "../../data/hatemm/text_features"
  annotation_file: "../../data/hatemm/dataset/annotations.json"
  num_classes: 1
  feature_fps: 1.0
  max_seq_len: 512
  input_dims:
    text: 768
    audio: 1024
    video: 768

fusion:
  d_cma: 64
  num_heads: 4
  dropout: 0.3
  query_modality: "text"
  key_modalities: ["audio", "video"]
  zero_out_missing_query: true

backbone:
  type: "temporalmaxer"
  d_model: 128
  n_proj_layers: 1
  n_layers: 4            # <- 4 levels: n_branch=3, n_levels=4 (was n_layers=3)
  n_heads: 2
  window_size: 17
  downsample_start: 1
  downsample_ratio: 2
  pool_kernel_size: 3

neck:
  type: "identity"

heads:
  type: "standard"
  n_layers: 1
  kernel_size: 3
  use_layer_norm: false

regression_ranges:       # <- 4 entries required for n_levels=4
  - [0,   16]            # stride 1 — segments 0–32s
  - [16,  64]            # stride 2 — segments 32–128s
  - [64,  128]           # stride 4 — segments 128–256s
  - [128, 100000]        # stride 8 — segments ≥256s

loss:
  focal_alpha: 0.40
  focal_gamma: 3.0
  lambda_reg: 1.0
  center_sampling: true
  center_sampling_radius: 2.0

training:
  batch_size: 8
  epochs: 10
  learning_rate: 1.0e-4
  weight_decay: 5.0e-4
  warmup_epochs: 5
  lr_scheduler: "cosine"
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 1.0
  cls_prior_prob: 0.01
  dropout: 0.5
  droppath: 0.3
  label_smoothing: 0.1

augmentation:
  enabled: true
  feature_noise_std: 0.01
  temporal_mask_prob: 0.5
  temporal_mask_num: 2
  temporal_mask_max_len: 3
  segment_jitter_sec: 0.5

inference:
  score_threshold: 0.001
  nms_method: "soft_nms"
  nms_sigma: 0.4
  nms_threshold: 0.1
  max_detections: 200
