# -----------------------------------------------------------------------------
# Experiment: TriDet 4-level pyramid with deeper stem (downsample_start=2)
#
# Purpose: downsample_start controls how many non-downsampling layers precede
# the first stride. Setting it to 2 means 2 full-resolution SGP layers build
# richer local features before the pyramid begins, while n_layers=5 keeps the
# total branch depth the same (n_branch = n_layers - n_stem = 5 - 2 = 3,
# n_levels = 1 + 3 = 4 levels). This tests whether more pre-pyramid context
# improves the quality of features passed into each pyramid level.
#
# Changes vs exp_tridet_deep.yaml:
#   backbone.downsample_start: 1 -> 2
#   backbone.n_layers:         4 -> 5   (preserves 4 pyramid levels)
#   training.patience:          5 -> 10
#
# Params: ~1.2M
# -----------------------------------------------------------------------------

dataset:
  name: "hatemm"
  video_feat_dir: "../../data/hatemm/video_features"
  audio_feat_dir: "../../data/hatemm/audio_features"
  text_feat_dir:  "../../data/hatemm/text_features"
  annotation_file: "../../data/hatemm/dataset/annotations.json"
  num_classes: 1
  feature_fps: 1.0
  max_seq_len: 512
  input_dims:
    text: 768
    audio: 1024
    video: 768

fusion:
  d_cma: 64
  num_heads: 4
  dropout: 0.3
  query_modality: "text"
  key_modalities: ["audio", "video"]
  zero_out_missing_query: true

backbone:
  type: "sgp"
  d_model: 128
  n_proj_layers: 1
  n_layers: 5
  n_heads: 2
  window_size: 17
  downsample_start: 2
  downsample_ratio: 2
  sgp_kernel_size: 3
  sgp_mlp_dim: 512
  sgp_k: 1.5
  sgp_init_conv_vars: 1
  sgp_downsample_type: "max"

neck:
  type: "identity"

heads:
  type: "trident"
  n_layers: 3
  kernel_size: 3
  use_layer_norm: true
  boundary_kernel_size: 3
  num_bins: 16
  iou_weight_power: 2

regression_ranges:
  - [0,   16]
  - [16,  32]
  - [32,  64]
  - [64,  100000]

loss:
  focal_alpha: 0.40
  focal_gamma: 3.0
  lambda_reg: 1.0
  center_sampling: true
  center_sampling_radius: 2.0

training:
  batch_size: 8
  epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 5.0e-4
  warmup_epochs: 10
  lr_scheduler: "cosine"
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 1.0
  patience: 10
  cls_prior_prob: 0.01
  dropout: 0.5
  droppath: 0.3
  label_smoothing: 0.1

augmentation:
  enabled: true
  feature_noise_std: 0.05
  temporal_mask_prob: 0.5
  temporal_mask_num: 4
  temporal_mask_max_len: 6
  segment_jitter_sec: 1.0

inference:
  score_threshold: 0.001
  nms_method: "soft_nms"
  nms_sigma: 0.4
  nms_threshold: 0.1
  max_detections: 200
