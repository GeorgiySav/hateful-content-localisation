dataset:
  name: "hateclipseg"
  video_feat_dir: "../../data/hateclipseg/video_features"
  audio_feat_dir: "../../data/hateclipseg/audio_features"
  text_feat_dir:  "../../data/hateclipseg/text_features"
  annotation_file: "../../data/hateclipseg/dataset/hateclipseg.json"
  use_json_split: false                 # use internal stratified split instead of JSON "subset" field
  val_ratio: 0.2
  split_seed: 42
  num_classes: 1
  feature_fps: 1.0
  max_seq_len: 512
  input_dims:
    text: 768
    audio: 1024
    video: 768

preprocessor:
  type: "trifuse"
  d_out: 256              # d_model inside TriFuse; backbone n_in = 3 * d_out = 768
  n_heads: 4
  n_fusion_layers: 4
  dropout: 0.3

backbone:
  type: "transformer"
  d_model: 256
  n_proj_layers: 1        # single projection conv since preprocessor already projects to d_model
  n_layers: 5
  n_heads: 4
  window_size: 17
  downsample_start: 1
  downsample_ratio: 2

neck:
  type: "identity"

heads:
  type: "standard"
  n_layers: 3
  kernel_size: 3
  use_layer_norm: true

regression_ranges:
  - [0,    4]
  - [4,    8]
  - [8,   16]
  - [16,  32]
  - [32,  100000]

loss:
  focal_alpha: 0.5
  focal_gamma: 2.0
  lambda_reg: 1.0
  center_sampling: true
  center_sampling_radius: 2.0

training:
  batch_size: 8
  epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 5.0e-3
  warmup_epochs: 5
  lr_scheduler: "cosine"
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 1.0
  cls_prior_prob: 0.01
  dropout: 0.3
  droppath: 0.1
  label_smoothing: 0.05
  weighted_sampling: false

augmentation:
  enabled: true
  feature_noise_std: 0.02
  temporal_mask_prob: 0.5
  temporal_mask_num: 2
  temporal_mask_max_len: 2
  segment_jitter_sec: 0.5

inference:
  score_threshold: 0.001
  nms_method: "soft_nms"
  nms_sigma: 0.2
  nms_threshold: 0.1
  max_detections: 200
