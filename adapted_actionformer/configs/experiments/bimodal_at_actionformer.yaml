# ─────────────────────────────────────────────────────────────────────────────
# Experiment: Bimodal (audio + text) + ActionFormer backbone
#
# Architecture:   concat[audio,text] → transformer → standard head
# Purpose:        Bimodal ablation — removes video (CLIP ViT-L/14) to quantify
#                 its contribution.  Audio-text is a natural pairing as both
#                 modalities capture spoken content (Wav2Vec2 acoustics +
#                 HateBERT semantics); this tests whether visual context adds
#                 anything beyond speech-based cues.
#
# Preprocessor:   concat (audio+text, d_out=1792)
# Backbone:       transformer (ActionFormer, 5 levels, window=17)
# Heads:          standard
# ─────────────────────────────────────────────────────────────────────────────

dataset:
  name: "hateclipseg"
  video_feat_dir: "../../../data/hateclipseg/1fps/video_features"
  audio_feat_dir: "../../../data/hateclipseg/1fps/audio_features"
  text_feat_dir:  "../../../data/hateclipseg/1fps/text_features"
  annotation_file: "../../../data/hateclipseg/dataset/hateclipseg.json"
  use_json_split: false
  split_seed: 42
  num_classes: 1
  feature_fps: 1.0
  max_seq_len: 512
  input_dims:
    text: 768                           # HateBERT CLS
    audio: 1024                         # Wav2Vec2 Large
    video: 768                          # CLIP ViT-L/14

preprocessor:
  type: "concat"
  modalities: ["audio", "text"]
  modality_dropout: 0.1

backbone:
  type: "transformer"
  d_model: 512
  n_proj_layers: 2
  n_layers: 5                           # strides: [1, 2, 4, 8, 16]
  n_heads: 4
  window_size: 17
  downsample_start: 1
  downsample_ratio: 2

heads:
  type: "standard"
  n_layers: 2
  kernel_size: 3
  use_layer_norm: true

regression_ranges:
  - [0,    4]
  - [4,    8]
  - [8,   16]
  - [16,  32]
  - [32,  100000]

loss:
  focal_alpha: 0.45
  focal_gamma: 2.0
  lambda_reg: 1.0
  center_sampling: true
  center_sampling_radius: 2.0

training:
  batch_size: 8
  epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 1.0e-3
  warmup_epochs: 5
  lr_scheduler: "cosine"
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 1.0
  cls_prior_prob: 0.01
  dropout: 0.2
  droppath: 0.1
  label_smoothing: 0.00
  patience: 10

augmentation:
  enabled: true
  feature_noise_std: 0.02
  temporal_shift_max_frames: 8

inference:
  score_threshold: 0.001
  nms_method: "soft_nms"
  nms_sigma: 0.4
  nms_threshold: 0.1
  max_detections: 200
