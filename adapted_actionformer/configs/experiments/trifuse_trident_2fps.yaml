# ─────────────────────────────────────────────────────────────────────────────
# Experiment: TriFuse preprocessor + SGP backbone + Trident head @ 2 fps
#
# Architecture:   trifuse → sgp → identity → trident
# Based on:       trifuse_tridet.yaml (canonical TriDet configuration)
# Purpose:        2fps variant — intermediate temporal resolution (0.5 s per
#                 feature) between the 1fps baseline and the 4fps config.
#                 Regression ranges are scaled ×2 relative to the 1fps config.
#
# Feature stats (2 fps):
#   Files : 401   |   Min T: 359   Max T: 729   Mean T: 479   P99 T: 642
#
# Preprocessor:   trifuse (d_out=768, 1 fusion layer)
# Backbone:       sgp (depthwise conv pyramid, 5 levels)
# Neck:           identity
# Heads:          trident (boundary distribution, 16 bins)
#
# Divisibility:   SGP max_div_factor = largest stride = 16  →  1024 ÷ 16 = 64 ✓
# ─────────────────────────────────────────────────────────────────────────────

dataset:
  name: "hateclipseg"
  video_feat_dir: "../../../data/hateclipseg/2fps/video_features"
  audio_feat_dir: "../../../data/hateclipseg/2fps/audio_features"
  text_feat_dir:  "../../../data/hateclipseg/2fps/text_features"
  annotation_file: "../../../data/hateclipseg/dataset/hateclipseg.json"
  use_json_split: false
  split_seed: 42
  num_classes: 1
  feature_fps: 2.0                      # 0.5 s per feature (2× finer than 1fps)
  max_seq_len: 1024                      # covers max observed T=729; div by 16 ✓
  input_dims:
    text: 768                            # HateBERT CLS
    audio: 1024                          # Wav2Vec2 Large
    video: 768                           # CLIP ViT-L/14

preprocessor:
  type: "trifuse"
  d_out: 768
  n_heads: 4
  n_fusion_layers: 1
  dropout: 0.1
  modality_dropout: 0.1

backbone:
  type: "sgp"
  d_model: 512
  n_proj_layers: 2
  n_layers: 5                            # strides: [1, 2, 4, 8, 16]
  n_heads: 2                             # ignored by sgp; kept for API compatibility
  window_size: 17                        # ignored by sgp; kept for API compatibility
  downsample_start: 1
  downsample_ratio: 2
  sgp_kernel_size: 3
  sgp_mlp_dim: 512                       # 1.5× d_model; lower than default 4× to keep params manageable
  sgp_k: 1.5
  sgp_init_conv_vars: 1
  sgp_downsample_type: "max"

neck:
  type: "identity"

heads:
  type: "trident"
  n_layers: 2
  kernel_size: 3
  use_layer_norm: true
  boundary_kernel_size: 3
  num_bins: 8
  iou_weight_power: 2

# Regression ranges in feature-index units (seconds × 2fps).
# Level mapping:   L0 [0,8]→0–4 s  |  L1 [8,16]→4–8 s  |  L2 [16,32]→8–16 s
#                  L3 [32,64]→16–32 s  |  L4 [64,∞]→32+ s
regression_ranges:
  - [0,    8]
  - [8,    16]
  - [16,   32]
  - [32,   64]
  - [64,   100000]

loss:
  focal_alpha: 0.45
  focal_gamma: 2.0
  lambda_reg: 1.0
  center_sampling: true
  center_sampling_radius: 1.5

training:
  batch_size: 8
  epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 1.0e-3
  warmup_epochs: 5
  lr_scheduler: "cosine"
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 1.0
  cls_prior_prob: 0.01
  dropout: 0.2
  droppath: 0.1
  label_smoothing: 0.00
  weighted_sampling: false
  patience: 10

augmentation:
  enabled: true
  feature_noise_std: 0.02
  temporal_mask_prob: 0.5
  temporal_mask_num: 2
  temporal_mask_max_len: 6              # 4 frames = 2 s at 2fps
  segment_jitter_sec: 1.5

inference:
  score_threshold: 0.001
  nms_method: "soft_nms"
  nms_sigma: 0.4
  nms_threshold: 0.1
  max_detections: 200
