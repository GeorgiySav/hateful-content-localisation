# ─────────────────────────────────────────────────────────────────────────────
# Experiment: SGP backbone + concat preprocessor
#
# Architecture:   concat → sgp → identity → standard
# Purpose:        TriDet's Scalable-Granularity Perception backbone with a
#                 standard head (ablating the trident head). SGP uses dual-
#                 branch depthwise conv instead of self-attention: one branch
#                 captures instant-level context (kernel=3), another captures
#                 window-level context via a scaled depthwise conv, avoiding
#                 the O(L²) attention cost and enabling longer receptive fields.
#
# Preprocessor:   concat (video+audio+text, d_out=2560)
# Backbone:       sgp (depthwise conv pyramid, 5 levels)
# Neck:           identity
# Heads:          standard (direct offset regression)
# ─────────────────────────────────────────────────────────────────────────────

dataset:
  name: "hateclipseg"
  video_feat_dir: "../../../data/hateclipseg/video_features"
  audio_feat_dir: "../../../data/hateclipseg/audio_features"
  text_feat_dir:  "../../../data/hateclipseg/text_features"
  annotation_file: "../../../data/hateclipseg/dataset/hateclipseg.json"
  num_classes: 1
  feature_fps: 1.0
  max_seq_len: 512
  input_dims:
    text: 768
    audio: 1024
    video: 768

preprocessor:
  type: "concat"
  modalities: ["video", "audio", "text"]
  d_out: 2560

backbone:
  type: "sgp"
  d_model: 256
  n_proj_layers: 4
  n_layers: 5               # strides: [1, 2, 4, 8, 16]
  n_heads: 2                # ignored by sgp; kept for API compatibility
  window_size: 17           # ignored by sgp; kept for API compatibility
  downsample_start: 1
  downsample_ratio: 2
  sgp_kernel_size: 3        # instant-level depthwise conv kernel
  sgp_mlp_dim: 1024         # FFN hidden dim (4× d_model)
  sgp_k: 1.5                # window-level kernel scale factor
  sgp_init_conv_vars: 1     # Gaussian init std for SGP depthwise weights
  sgp_downsample_type: "max"

neck:
  type: "identity"

heads:
  type: "standard"
  n_layers: 3
  kernel_size: 3
  use_layer_norm: true

regression_ranges:
  - [0,    4]
  - [4,    8]
  - [8,   16]
  - [16,  32]
  - [32,  100000]

loss:
  focal_alpha: 0.40
  focal_gamma: 2.0
  lambda_reg: 1.0
  center_sampling: true
  center_sampling_radius: 2.0

training:
  batch_size: 8
  epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 1.0e-3
  warmup_epochs: 5
  lr_scheduler: "cosine"
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 1.0
  cls_prior_prob: 0.01
  dropout: 0.3
  droppath: 0.2
  label_smoothing: 0.10
  weighted_sampling: false
  patience: 10

augmentation:
  enabled: true
  feature_noise_std: 0.02
  temporal_mask_prob: 0.5
  temporal_mask_num: 2
  temporal_mask_max_len: 2
  segment_jitter_sec: 0.5

inference:
  score_threshold: 0.001
  nms_method: "soft_nms"
  nms_sigma: 0.2
  nms_threshold: 0.1
  max_detections: 200
