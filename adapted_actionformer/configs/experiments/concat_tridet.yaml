# ─────────────────────────────────────────────────────────────────────────────
# Experiment: Concat preprocessor + SGP backbone + Trident head
#
# Architecture:   concat → sgp → identity → trident
# Purpose:        Baseline for trifuse_tridet.yaml — the canonical TriDet
#                 configuration (Sun et al., CVPR 2023) with simple concatenation
#                 in place of TriFuse.  Any gain from trifuse_tridet over this
#                 config is attributable solely to TriFuse's cross-modal fusion.
#
# Preprocessor:   concat (video+audio+text, d_out=2560)
# Backbone:       sgp (depthwise conv pyramid, 5 levels)
# Neck:           identity
# Heads:          trident (boundary distribution, 16 bins)
# ─────────────────────────────────────────────────────────────────────────────

dataset:
  name: "hateclipseg"
  video_feat_dir: "../../../data/hateclipseg/video_features"
  audio_feat_dir: "../../../data/hateclipseg/audio_features"
  text_feat_dir:  "../../../data/hateclipseg/text_features"
  annotation_file: "../../../data/hateclipseg/dataset/hateclipseg.json"
  use_json_split: false                 # use internal stratified split instead of JSON "subset" field
  split_seed: 42
  num_classes: 1
  feature_fps: 1.0
  max_seq_len: 512
  input_dims:
    text: 768
    audio: 1024
    video: 768

preprocessor:
  type: "concat"
  modalities: ["video", "audio", "text"]
  modality_dropout: 0.1

backbone:
  type: "sgp"
  d_model: 512
  n_proj_layers: 2                      # two proj convs to reduce 2560 → 512
  n_layers: 5               # strides: [1, 2, 4, 8, 16]
  n_heads: 2                # ignored by sgp; kept for API compatibility
  window_size: 17           # ignored by sgp; kept for API compatibility
  downsample_start: 1
  downsample_ratio: 2
  sgp_kernel_size: 3
  sgp_mlp_dim: 768         # matches trifuse_tridet (not 4× d_model — check if intentional)
  sgp_k: 1.5
  sgp_init_conv_vars: 1
  sgp_downsample_type: "max"

neck:
  type: "identity"

heads:
  type: "trident"
  n_layers: 2
  kernel_size: 3
  use_layer_norm: true
  boundary_kernel_size: 3
  num_bins: 16
  iou_weight_power: 2

regression_ranges:
  - [0,    4]
  - [4,    8]
  - [8,   16]
  - [16,  32]
  - [32,  100000]

loss:
  focal_alpha: 0.45
  focal_gamma: 2.0
  lambda_reg: 1.0
  center_sampling: true
  center_sampling_radius: 2.0

training:
  batch_size: 8
  epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 1.0e-3
  warmup_epochs: 5
  lr_scheduler: "cosine"
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 1.0
  cls_prior_prob: 0.01
  dropout: 0.2
  droppath: 0.1
  label_smoothing: 0.00
  patience: 10

augmentation:
  enabled: true
  feature_noise_std: 0.02
  temporal_shift_max_frames: 8

inference:
  score_threshold: 0.001
  nms_method: "soft_nms"
  nms_sigma: 0.4
  nms_threshold: 0.1
  max_detections: 200
