# ─────────────────────────────────────────────────────────────────────────────
# FPS Ablation: TriFuse + SGP + Trident @ 4 fps
#
# Architecture identical to trifuse_tridet.yaml (1fps baseline).
# Only fps-dependent parameters change:
#   feature_fps        1.0  → 4.0
#   max_seq_len        512  → 2048   (covers max observed T=1457; 2048÷16=128 ✓)
#   regression_ranges  ×4          (feature-index units scale with fps)
#   batch_size         8   → 4    (4× seq len raises peak memory)
#
# Feature stats @ 4fps:  min T=675  max T=1457  mean T=948  p99 T=1319
# ─────────────────────────────────────────────────────────────────────────────

dataset:
  name: "hateclipseg"
  video_feat_dir: "../../../data/hateclipseg/4fps/video_features"
  audio_feat_dir: "../../../data/hateclipseg/4fps/audio_features"
  text_feat_dir:  "../../../data/hateclipseg/4fps/text_features"
  annotation_file: "../../../data/hateclipseg/dataset/hateclipseg.json"
  use_json_split: false
  split_seed: 42
  num_classes: 1
  feature_fps: 4.0
  max_seq_len: 2048
  input_dims:
    text: 768
    audio: 1024
    video: 768

preprocessor:
  type: "trifuse"
  d_out: 768
  n_heads: 4
  n_fusion_layers: 1
  dropout: 0.1
  modality_dropout: 0.1

backbone:
  type: "sgp"
  d_model: 512
  n_proj_layers: 2
  n_layers: 5
  n_heads: 2
  window_size: 17
  downsample_start: 1
  downsample_ratio: 2
  sgp_kernel_size: 3
  sgp_mlp_dim: 768
  sgp_k: 1.5
  sgp_init_conv_vars: 1
  sgp_downsample_type: "max"

neck:
  type: "identity"

heads:
  type: "trident"
  n_layers: 2
  kernel_size: 3
  use_layer_norm: true
  boundary_kernel_size: 3
  num_bins: 16
  iou_weight_power: 2

# Ranges in feature-index units — scaled ×4 vs 1fps to cover same durations.
regression_ranges:
  - [0,    16]
  - [16,   32]
  - [32,   64]
  - [64,   128]
  - [128,  100000]

loss:
  focal_alpha: 0.45
  focal_gamma: 2.0
  lambda_reg: 1.0
  center_sampling: true
  center_sampling_radius: 2.0

training:
  batch_size: 4                         # halved — 4× seq len raises peak memory
  epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 1.0e-3
  warmup_epochs: 5
  lr_scheduler: "cosine"
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 1.0
  cls_prior_prob: 0.01
  dropout: 0.2
  droppath: 0.1
  label_smoothing: 0.00
  weighted_sampling: false
  patience: 10

augmentation:
  enabled: true
  feature_noise_std: 0.02

inference:
  score_threshold: 0.001
  nms_method: "soft_nms"
  nms_sigma: 0.4
  nms_threshold: 0.1
  max_detections: 200
