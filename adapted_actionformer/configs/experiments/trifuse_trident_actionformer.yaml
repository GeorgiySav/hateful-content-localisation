# ─────────────────────────────────────────────────────────────────────────────
# Experiment: TriFuse preprocessor + ActionFormer backbone + Trident head
#
# Architecture:   trifuse → transformer → identity → trident
# Purpose:        Tests whether the trident boundary-distribution head improves
#                 over the standard head when paired with ActionFormer's windowed
#                 self-attention backbone.  Pair with trifuse_actionformer.yaml
#                 (standard head) to isolate the head contribution.
#
# Preprocessor:   trifuse (d_out=768, 1 fusion layer)
# Backbone:       transformer (ActionFormer, 5 levels, window=17)
# Neck:           identity
# Heads:          trident (boundary distribution, 16 bins)
# ─────────────────────────────────────────────────────────────────────────────

dataset:
  name: "hateclipseg"
  video_feat_dir: "../../../data/hateclipseg/1fps/video_features"
  audio_feat_dir: "../../../data/hateclipseg/1fps/audio_features"
  text_feat_dir:  "../../../data/hateclipseg/1fps/text_features"
  annotation_file: "../../../data/hateclipseg/dataset/hateclipseg.json"
  use_json_split: false
  split_seed: 42
  num_classes: 1
  feature_fps: 1.0
  max_seq_len: 512
  input_dims:
    text: 768                           # HateBERT CLS
    audio: 1024                         # Wav2Vec2 Large
    video: 768                          # CLIP ViT-L/14

preprocessor:
  type: "trifuse"
  d_model: 768
  n_heads: 4
  n_fusion_layers: 1
  dropout: 0.1
  modality_dropout: 0.1

backbone:
  type: "transformer"
  d_model: 512
  n_proj_layers: 2
  n_layers: 5                           # strides: [1, 2, 4, 8, 16]
  n_heads: 4
  window_size: 17
  downsample_start: 1
  downsample_ratio: 2

neck:
  type: "identity"

heads:
  type: "trident"
  n_layers: 2
  kernel_size: 3
  use_layer_norm: true
  boundary_kernel_size: 3
  num_bins: 16
  iou_weight_power: 2

regression_ranges:
  - [0,    4]
  - [4,    8]
  - [8,   16]
  - [16,  32]
  - [32,  100000]

loss:
  focal_alpha: 0.45
  focal_gamma: 2.0
  lambda_reg: 1.0
  center_sampling: true
  center_sampling_radius: 2.0

training:
  batch_size: 8
  epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 1.0e-3
  warmup_epochs: 5
  lr_scheduler: "cosine"
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 1.0
  cls_prior_prob: 0.01
  dropout: 0.2
  droppath: 0.1
  label_smoothing: 0.00
  patience: 10

augmentation:
  enabled: true
  feature_noise_std: 0.02
  temporal_shift_max_frames: 8

inference:
  score_threshold: 0.001
  nms_method: "soft_nms"
  nms_sigma: 0.4
  nms_threshold: 0.1
  max_detections: 200
