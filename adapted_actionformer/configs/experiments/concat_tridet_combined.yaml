# ─────────────────────────────────────────────────────────────────────────────
# Experiment: TriDet + all anti-overfitting measures combined
#
# Architecture:   concat → sgp → identity → trident
# Purpose:        Combines all three regularization axes from the ablation
#                 experiments. If this matches or beats the individual fixes,
#                 the axes are complementary; if not, one dominates.
#
# Changes vs concat_tridet (base):
#   Capacity:      d_model 256→128, sgp_mlp_dim 1024→512, n_proj_layers 4→3
#   Regularization: dropout 0.3→0.5, droppath 0.2→0.35,
#                   weight_decay 1e-3→5e-3, label_smoothing 0.10→0.20
#   Augmentation:  feature_noise_std 0.02→0.05, temporal_mask_prob 0.5→0.7,
#                  temporal_mask_num 2→3, temporal_mask_max_len 2→3,
#                  segment_jitter_sec 0.5→1.0
# ─────────────────────────────────────────────────────────────────────────────

dataset:
  name: "hateclipseg"
  video_feat_dir: "../../../data/hateclipseg/video_features"
  audio_feat_dir: "../../../data/hateclipseg/audio_features"
  text_feat_dir:  "../../../data/hateclipseg/text_features"
  annotation_file: "../../../data/hateclipseg/dataset/hateclipseg.json"
  num_classes: 1
  feature_fps: 1.0
  max_seq_len: 512
  input_dims:
    text: 768
    audio: 1024
    video: 768

preprocessor:
  type: "concat"
  modalities: ["video", "audio", "text"]
  d_out: 2560

backbone:
  type: "sgp"
  d_model: 128              # ↓ from 256
  n_proj_layers: 3          # ↓ from 4
  n_layers: 5
  n_heads: 2
  window_size: 17
  downsample_start: 1
  downsample_ratio: 2
  sgp_kernel_size: 3
  sgp_mlp_dim: 512          # ↓ from 1024
  sgp_k: 1.5
  sgp_init_conv_vars: 1
  sgp_downsample_type: "max"

neck:
  type: "identity"

heads:
  type: "trident"
  n_layers: 3
  kernel_size: 3
  use_layer_norm: true
  boundary_kernel_size: 3
  num_bins: 16
  iou_weight_power: 2

regression_ranges:
  - [0,    4]
  - [4,    8]
  - [8,   16]
  - [16,  32]
  - [32,  100000]

loss:
  focal_alpha: 0.40
  focal_gamma: 2.0
  lambda_reg: 1.0
  center_sampling: true
  center_sampling_radius: 2.0

training:
  batch_size: 8
  epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 5.0e-3      # ↑ from 1e-3
  warmup_epochs: 5
  lr_scheduler: "cosine"
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 1.0
  cls_prior_prob: 0.01
  dropout: 0.5              # ↑ from 0.3
  droppath: 0.35            # ↑ from 0.2
  label_smoothing: 0.20     # ↑ from 0.10
  weighted_sampling: false
  patience: 10

augmentation:
  enabled: true
  feature_noise_std: 0.05      # ↑ from 0.02
  temporal_mask_prob: 0.7      # ↑ from 0.5
  temporal_mask_num: 3         # ↑ from 2
  temporal_mask_max_len: 3     # ↑ from 2
  segment_jitter_sec: 1.0      # ↑ from 0.5

inference:
  score_threshold: 0.001
  nms_method: "soft_nms"
  nms_sigma: 0.2
  nms_threshold: 0.1
  max_detections: 200
