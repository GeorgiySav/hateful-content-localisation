# ─────────────────────────────────────────────────────────────────────────────
# Experiment: Concat preprocessor + TemporalMaxer backbone + Trident head
#
# Architecture:   concat → temporalmaxer → identity → trident
# Purpose:        Baseline for trifuse_trident_temporalmaxer.yaml — replaces
#                 TriFuse with simple concatenation while keeping the trident
#                 head on top of TemporalMaxer.  Completes the 2×2 grid:
#                 {concat, trifuse} × {standard, trident} for TemporalMaxer.
#
# Preprocessor:   concat (video+audio+text, d_out=2560)
# Backbone:       temporalmaxer (MaxPool1D pyramid, 5 levels, 2x downsample)
# Neck:           identity
# Heads:          trident (boundary distribution, 16 bins)
# ─────────────────────────────────────────────────────────────────────────────

dataset:
  name: "hateclipseg"
  video_feat_dir: "../../../data/hateclipseg/video_features"
  audio_feat_dir: "../../../data/hateclipseg/audio_features"
  text_feat_dir:  "../../../data/hateclipseg/text_features"
  annotation_file: "../../../data/hateclipseg/dataset/hateclipseg.json"
  use_json_split: false
  split_seed: 42
  num_classes: 1
  feature_fps: 1.0
  max_seq_len: 512
  input_dims:
    text: 768                           # HateBERT CLS
    audio: 1024                         # Wav2Vec2 Large
    video: 768                          # CLIP ViT-L/14

preprocessor:
  type: "concat"
  modalities: ["video", "audio", "text"]
  d_out: 2560                           # 768 + 1024 + 768

backbone:
  type: "temporalmaxer"
  d_model: 512
  n_proj_layers: 2
  n_layers: 5                           # 1 stem + 4 branch → strides [1,2,4,8,16]
  n_heads: 4                            # unused by temporalmaxer; kept for API compatibility
  window_size: 17                       # unused by temporalmaxer; kept for API compatibility
  downsample_start: 1
  downsample_ratio: 2
  pool_kernel_size: 3

neck:
  type: "identity"

heads:
  type: "trident"
  n_layers: 2
  kernel_size: 3
  use_layer_norm: true
  boundary_kernel_size: 3
  num_bins: 16
  iou_weight_power: 2

regression_ranges:
  - [0,    4]
  - [4,    8]
  - [8,   16]
  - [16,  32]
  - [32,  100000]

loss:
  focal_alpha: 0.45
  focal_gamma: 2.0
  lambda_reg: 1.0
  center_sampling: true
  center_sampling_radius: 2.0

training:
  batch_size: 8
  epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 1.0e-3
  warmup_epochs: 5
  lr_scheduler: "cosine"
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 1.0
  cls_prior_prob: 0.01
  dropout: 0.2
  droppath: 0.0           # MaxPool backbone has no learnable blocks; droppath has no effect
  label_smoothing: 0.00
  weighted_sampling: false
  patience: 10

augmentation:
  enabled: true
  feature_noise_std: 0.02
  temporal_mask_prob: 0.5
  temporal_mask_num: 2
  temporal_mask_max_len: 2
  segment_jitter_sec: 0.5

inference:
  score_threshold: 0.001
  nms_method: "soft_nms"
  nms_sigma: 0.4
  nms_threshold: 0.1
  max_detections: 200
