# ─────────────────────────────────────────────────────────────────────────────
# Experiment: TriFuse preprocessor + SGP backbone + Trident head @ 4 fps
#
# Architecture:   trifuse → sgp → identity → trident
# Based on:       trifuse_tridet.yaml (canonical TriDet configuration)
# Purpose:        4fps variant — higher temporal resolution (0.25 s per feature)
#                 enables finer-grained boundary localisation. Regression ranges
#                 are scaled ×4 relative to the 1fps config so they remain in
#                 feature-index units after the fps-agnostic fix in
#                 meta_arch._label_single_video.
#
# Feature stats (4 fps):
#   Files : 401   |   Min T: 675   Max T: 1457   Mean T: 948   P99 T: 1319
#
# Preprocessor:   trifuse (d_out=768, 1 fusion layer)
# Backbone:       sgp (depthwise conv pyramid, 5 levels)
# Neck:           identity
# Heads:          trident (boundary distribution, 16 bins)
#
# Divisibility:   SGP max_div_factor = largest stride = 16  →  2048 ÷ 16 = 128 ✓
# ─────────────────────────────────────────────────────────────────────────────

dataset:
  name: "hateclipseg"
  video_feat_dir: "../../../data/hateclipseg/4fps/video_features"
  audio_feat_dir: "../../../data/hateclipseg/4fps/audio_features"
  text_feat_dir:  "../../../data/hateclipseg/4fps/text_features"
  annotation_file: "../../../data/hateclipseg/dataset/hateclipseg.json"
  use_json_split: false
  split_seed: 42
  num_classes: 1
  feature_fps: 4.0                      # 0.25 s per feature (4× finer than 1fps)
  max_seq_len: 2048                      # covers max observed T=1457; div by 16 ✓
  input_dims:
    text: 768                            # HateBERT CLS
    audio: 1024                          # Wav2Vec2 Large
    video: 768                           # CLIP ViT-L/14

preprocessor:
  type: "trifuse"
  d_out: 768
  n_heads: 4
  n_fusion_layers: 1
  dropout: 0.1
  modality_dropout: 0.1

backbone:
  type: "sgp"
  d_model: 512
  n_proj_layers: 2
  n_layers: 5                            # strides: [1, 2, 4, 8, 16]
  n_heads: 2                             # ignored by sgp; kept for API compatibility
  window_size: 17                        # ignored by sgp; kept for API compatibility
  downsample_start: 1
  downsample_ratio: 2
  sgp_kernel_size: 3
  sgp_mlp_dim: 768                       # 1.5× d_model; lower than default 4× to keep params manageable
  sgp_k: 1.5
  sgp_init_conv_vars: 1
  sgp_downsample_type: "max"

neck:
  type: "identity"

heads:
  type: "trident"
  n_layers: 2
  kernel_size: 3
  use_layer_norm: true
  boundary_kernel_size: 3
  num_bins: 16
  iou_weight_power: 2

# Regression ranges in feature-index units (seconds × 4fps).
# Level mapping:   L0 [0,16]→0–4 s  |  L1 [16,32]→4–8 s  |  L2 [32,64]→8–16 s
#                  L3 [64,128]→16–32 s  |  L4 [128,∞]→32+ s
regression_ranges:
  - [0,    16]
  - [16,   32]
  - [32,   64]
  - [64,   128]
  - [128,  100000]

loss:
  focal_alpha: 0.5
  focal_gamma: 2.0
  lambda_reg: 2.0
  center_sampling: true
  center_sampling_radius: 1.5

training:
  batch_size: 4                         # halved from 8 — 4× seq len raises peak memory
  epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  warmup_epochs: 5
  lr_scheduler: "cosine"
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 1.0
  cls_prior_prob: 0.01
  dropout: 0.2
  droppath: 0.1
  label_smoothing: 0.05
  weighted_sampling: true
  patience: 15

augmentation:
  enabled: true
  feature_noise_std: 0.02
  temporal_mask_prob: 0.5
  temporal_mask_num: 2
  temporal_mask_max_len: 8              # 8 frames = 2 s at 4fps
  segment_jitter_sec: 1.0

inference:
  score_threshold: 0.001
  nms_method: "soft_nms"
  nms_sigma: 0.4
  nms_threshold: 0.1
  max_detections: 200
