# ─────────────────────────────────────────────────────────────────────────────
# Experiment: Rich projection + deeper heads
#
# Changes vs temporalmaxer.yaml baseline:
#   fusion.d_cma:        64  -> 128   (wider CMA bottleneck -> richer fused repr)
#   backbone.n_proj_layers: 1 -> 2    (second proj conv gives more capacity before MaxPool)
#   heads.n_layers:      1  -> 2      (adds one hidden conv + LN + ReLU in cls/reg heads)
#   heads.use_layer_norm: false -> true  (meaningful now that n_layers=2)
#
# Rationale: MaxPool backbone is parameter-free, so all learning lives in:
#   (1) CMA fusion  (2) projection convs  (3) decoder heads.
# Widening (1)+(2)+(3) gives the model more expressiveness without changing
# the parameter-free temporal context mechanism.
#
# Approx params: ~590K  (baseline: ~445K)
# ─────────────────────────────────────────────────────────────────────────────

dataset:
  name: "hatemm"
  video_feat_dir: "../../data/hatemm/video_features"
  audio_feat_dir: "../../data/hatemm/audio_features"
  text_feat_dir:  "../../data/hatemm/text_features"
  annotation_file: "../../data/hatemm/dataset/annotations.json"
  num_classes: 1
  feature_fps: 1.0
  max_seq_len: 512
  input_dims:
    text: 768
    audio: 1024
    video: 768

fusion:
  d_cma: 128             # <- widened from 64 (32 dims/head with num_heads=4)
  num_heads: 4
  dropout: 0.3
  query_modality: "text"
  key_modalities: ["audio", "video"]
  zero_out_missing_query: true

backbone:
  type: "temporalmaxer"
  d_model: 128
  n_proj_layers: 2       # <- 2 projection convs (was 1)
  n_layers: 3
  n_heads: 2
  window_size: 17
  downsample_start: 1
  downsample_ratio: 2
  pool_kernel_size: 3

neck:
  type: "identity"

heads:
  type: "standard"
  n_layers: 2            # <- deeper heads (was 1)
  kernel_size: 3
  use_layer_norm: true   # <- now effective since n_layers=2

regression_ranges:
  - [0,   16]
  - [16,  64]
  - [64,  100000]

loss:
  focal_alpha: 0.40
  focal_gamma: 3.0
  lambda_reg: 1.0
  center_sampling: true
  center_sampling_radius: 2.0

training:
  batch_size: 8
  epochs: 10
  learning_rate: 1.0e-4
  weight_decay: 5.0e-4
  warmup_epochs: 5
  lr_scheduler: "cosine"
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 1.0
  cls_prior_prob: 0.01
  dropout: 0.5
  droppath: 0.3
  label_smoothing: 0.1

augmentation:
  enabled: true
  feature_noise_std: 0.01
  temporal_mask_prob: 0.5
  temporal_mask_num: 2
  temporal_mask_max_len: 3
  segment_jitter_sec: 0.5

inference:
  score_threshold: 0.001
  nms_method: "soft_nms"
  nms_sigma: 0.4
  nms_threshold: 0.1
  max_detections: 200
