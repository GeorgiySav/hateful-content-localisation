# ─────────────────────────────────────────────────────────────────────────────
# Experiment: Combined best (rich proj + FPN neck + lower dropout)
#
# Changes vs temporalmaxer.yaml baseline:
#   fusion.d_cma:          64  -> 128    (richer CMA output)
#   backbone.n_proj_layers:  1 -> 2      (deeper embedding network)
#   neck.type:       "identity" -> "fpn" (cross-scale feature fusion)
#   heads.n_layers:          1 -> 2      (deeper decoder heads)
#   heads.use_layer_norm: false -> true  (stabilise deeper heads)
#   training.dropout:      0.5 -> 0.3   (reduce over-regularization)
#   training.droppath:     0.3 -> 0.1   (consistent with lower dropout)
#
# 4-level pyramid is NOT combined here — it changes regression_ranges
# and is tested independently in exp_4level.yaml to keep this config
# comparable to the 3-level baseline.
#
# Approx params: ~640K
# ─────────────────────────────────────────────────────────────────────────────

dataset:
  name: "hatemm"
  video_feat_dir: "../../data/hatemm/video_features"
  audio_feat_dir: "../../data/hatemm/audio_features"
  text_feat_dir:  "../../data/hatemm/text_features"
  annotation_file: "../../data/hatemm/dataset/annotations.json"
  num_classes: 1
  feature_fps: 1.0
  max_seq_len: 512
  input_dims:
    text: 768
    audio: 1024
    video: 768

fusion:
  d_cma: 128             # <- widened from 64
  num_heads: 4
  dropout: 0.3
  query_modality: "text"
  key_modalities: ["audio", "video"]
  zero_out_missing_query: true

backbone:
  type: "temporalmaxer"
  d_model: 128
  n_proj_layers: 2       # <- two projection convs
  n_layers: 3
  n_heads: 2
  window_size: 17
  downsample_start: 1
  downsample_ratio: 2
  pool_kernel_size: 3

neck:
  type: "fpn"            # <- FPN with lateral convs + top-down path
  with_ln: true

heads:
  type: "standard"
  n_layers: 2            # <- deeper heads
  kernel_size: 3
  use_layer_norm: true   # <- effective with n_layers=2

regression_ranges:
  - [0,   16]
  - [16,  64]
  - [64,  100000]

loss:
  focal_alpha: 0.40
  focal_gamma: 3.0
  lambda_reg: 1.0
  center_sampling: true
  center_sampling_radius: 2.0

training:
  batch_size: 8
  epochs: 10
  learning_rate: 1.0e-4
  weight_decay: 5.0e-4
  warmup_epochs: 5
  lr_scheduler: "cosine"
  use_ema: true
  ema_decay: 0.999
  clip_grad_norm: 1.0
  cls_prior_prob: 0.01
  dropout: 0.3           # <- reduced from 0.5
  droppath: 0.1          # <- reduced from 0.3
  label_smoothing: 0.1

augmentation:
  enabled: true
  feature_noise_std: 0.01
  temporal_mask_prob: 0.5
  temporal_mask_num: 2
  temporal_mask_max_len: 3
  segment_jitter_sec: 0.5

inference:
  score_threshold: 0.001
  nms_method: "soft_nms"
  nms_sigma: 0.4
  nms_threshold: 0.1
  max_detections: 200
